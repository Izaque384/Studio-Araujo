name: Refine About editorial

on:
  push:
    paths:
      - '.about-editorial-trigger'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine About page
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sobre.html')
          s = p.read_text(encoding='utf-8')

          style = '''<style>
/* Página Sobre — composição editorial isolada */
.about-editorial{padding:108px 0 26px;overflow:hidden}.about-editorial .about-section{position:relative}.about-editorial .about-kicker{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}.about-editorial .about-kicker::before{content:'';width:34px;height:1px;background:var(--gold);opacity:.72}.about-editorial .about-heading{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3.15rem);font-weight:500;line-height:1.04;color:var(--cream);margin-bottom:30px}.about-editorial .about-copy p{font-size:1rem;line-height:1.85;color:rgba(243,236,220,.76);margin:0 0 22px}
.about-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.78fr);gap:clamp(54px,8vw,108px);align-items:center;padding-bottom:118px}.about-intro .about-copy{max-width:650px}.about-intro .about-photo-primary{position:relative;margin:0}.about-intro .about-photo-primary::before{content:'';position:absolute;left:-26px;top:34px;width:1px;height:62%;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.52}.about-intro .about-photo-primary img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center;border-radius:2px;box-shadow:0 28px 70px rgba(0,0,0,.34)}.about-photo-caption{margin-top:12px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(230,200,120,.72)}
.about-history{padding:108px 0 118px;border-top:1px solid rgba(201,162,75,.16);border-bottom:1px solid rgba(201,162,75,.16)}.about-history-head{max-width:700px;margin-bottom:54px}.about-timeline{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(30px,5vw,72px)}.about-timeline::before{content:'';position:absolute;left:0;right:0;top:17px;height:1px;background:linear-gradient(90deg,rgba(201,162,75,.08),rgba(201,162,75,.52),rgba(201,162,75,.08))}.about-era{position:relative;padding-top:50px}.about-era::before{content:'';position:absolute;top:11px;left:0;width:13px;height:13px;border-radius:50%;border:1px solid var(--gold);background:var(--bg);box-shadow:0 0 0 6px rgba(201,162,75,.045)}.about-year{display:block;font-family:'Cormorant Garamond',serif;font-size:2.15rem;line-height:1;color:var(--gold-light);margin-bottom:18px}.about-era p{font-size:.94rem;line-height:1.8;color:rgba(243,236,220,.7);margin:0}
.about-beliefs{display:grid;grid-template-columns:minmax(230px,.65fr) minmax(0,1.35fr);gap:clamp(54px,9vw,132px);padding:118px 0}.about-beliefs .about-heading{margin-bottom:0}.about-beliefs-copy{position:relative;padding-left:34px;border-left:1px solid rgba(201,162,75,.34)}.about-beliefs-copy p:first-child{font-family:'Cormorant Garamond',serif;font-size:clamp(1.55rem,2.8vw,2.2rem);line-height:1.35;color:var(--cream);margin-bottom:28px}
.about-family{padding:16px 0 70px}.about-family-head{max-width:680px;margin-bottom:48px}.about-family-story{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(44px,7vw,94px);align-items:center}.about-family-photo{margin:0}.about-family-photo img{width:100%;aspect-ratio:10/7;object-fit:cover;border-radius:2px;box-shadow:0 28px 70px rgba(0,0,0,.3)}.about-family-copy p:last-child{margin-bottom:0}.about-closing{position:relative;max-width:940px;margin:118px auto 36px;padding:62px 54px 66px;text-align:center}.about-closing::before{content:'';position:absolute;top:0;left:50%;width:74px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--gold-light),transparent)}.about-closing::after{content:'“';position:absolute;top:20px;left:50%;transform:translateX(-50%);font-family:'Cormorant Garamond',serif;font-size:5.5rem;line-height:1;color:rgba(201,162,75,.14)}.about-closing p{position:relative;z-index:1;font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3.5vw,2.75rem);font-style:italic;font-weight:400;line-height:1.38;color:var(--gold-light);margin:0}
@media(max-width:860px){.about-editorial{padding-top:78px}.about-intro{grid-template-columns:1fr;gap:42px;padding-bottom:84px}.about-intro .about-photo-primary{max-width:560px}.about-history{padding:82px 0 88px}.about-timeline{grid-template-columns:1fr;gap:0;padding-left:28px}.about-timeline::before{left:6px;right:auto;top:8px;bottom:8px;width:1px;height:auto;background:linear-gradient(180deg,rgba(201,162,75,.08),rgba(201,162,75,.52),rgba(201,162,75,.08))}.about-era{padding:0 0 46px 24px}.about-era:last-child{padding-bottom:0}.about-era::before{top:7px;left:-28px}.about-beliefs{grid-template-columns:1fr;gap:34px;padding:88px 0}.about-beliefs-copy{padding-left:26px}.about-family-story{grid-template-columns:1fr;gap:38px}.about-family-photo{order:2}.about-family-copy{order:1}.about-closing{margin-top:88px;padding:54px 24px 58px}}
@media(max-width:560px){.about-editorial{padding-top:62px}.about-editorial .about-copy p{font-size:.95rem;line-height:1.78}.about-intro{padding-bottom:68px}.about-intro .about-photo-primary::before{display:none}.about-history{padding:68px 0 72px}.about-history-head{margin-bottom:42px}.about-beliefs{padding:72px 0}.about-beliefs-copy{padding-left:20px}.about-family{padding-bottom:42px}.about-closing{margin-top:72px;padding:48px 10px 50px}}
</style>'''

          marker = '<link rel="stylesheet" href="styles.css">'
          if 'about-editorial{padding:108px' not in s:
              s = s.replace(marker, marker + '\n' + style, 1)

          start = s.index('  <section class="tight">')
          end = s.index('</main>', start)
          replacement = '''  <section class="about-editorial">
    <div class="wrap">
      <div class="about-section about-intro reveal">
        <div class="about-copy">
          <div class="about-kicker">Quem somos</div>
          <h2 class="about-heading">Michele &amp; Wellington Araújo</h2>
          <p>Somos Michele Araújo e Wellington Araújo, casal, pais e fotógrafos. O Studio Araújo nasceu da união da nossa família, da paixão pela fotografia e da certeza de que Deus nos chamou para transformar momentos em memórias que atravessam gerações.</p>
        </div>
        <figure class="about-photo-primary">
          <img src="assets/foto-equipe.jpg" width="900" height="1224" alt="Michele Araújo e Wellington Araújo, fotógrafos do Studio Araújo" loading="lazy" decoding="async">
          <figcaption class="about-photo-caption">Michele &amp; Wellington Araújo</figcaption>
        </figure>
      </div>

      <div class="about-section about-history reveal">
        <div class="about-history-head">
          <div class="about-kicker">Nossa história</div>
          <h2 class="about-heading">2015 → 2020 → hoje</h2>
        </div>
        <div class="about-timeline">
          <div class="about-era"><span class="about-year">2015</span><p>Nossa história na fotografia começou em 2015, em Sítio Alegre. Iniciamos fotografando eventos e, desde os primeiros trabalhos, fomos acolhidos com muito carinho pela nossa cidade. A confiança dos nossos clientes nos permitiu crescer e levar nosso trabalho para diversas cidades da região norte do Ceará.</p></div>
          <div class="about-era"><span class="about-year">2020</span><p>Em 2020, nasceu um novo capítulo: o Studio Araújo. O que começou com as tradicionais sessões de Natal logo se transformou em um espaço pensado para registrar a maternidade, o crescimento das crianças, os laços familiares e tantos outros momentos especiais.</p></div>
          <div class="about-era"><span class="about-year">Hoje</span><p>Seguimos investindo em conhecimento, equipamentos, estrutura e atendimento, porque acreditamos que a excelência é uma forma de honrar a confiança de quem nos escolhe.</p></div>
        </div>
      </div>

      <div class="about-section about-beliefs reveal">
        <div><div class="about-kicker">O que acreditamos</div><h2 class="about-heading">Experiência, acolhimento, excelência e memória.</h2></div>
        <div class="about-copy about-beliefs-copy"><p>Acreditamos que fotografar vai muito além de fazer belas imagens. É acolher pessoas, eternizar sentimentos e contar histórias de forma verdadeira. Por isso, buscamos oferecer uma experiência leve, personalizada e cheia de significado para cada família que passa por nosso estúdio.</p></div>
      </div>

      <div class="about-section about-family reveal">
        <div class="about-family-head"><div class="about-kicker">Nossa família / nossa essência</div><h2 class="about-heading">O que existe por trás de cada história que contamos.</h2></div>
        <div class="about-family-story">
          <figure class="about-family-photo"><img src="assets/familia-araujo.jpg" width="1000" height="698" alt="Família Araújo" loading="lazy" decoding="async"><figcaption class="about-photo-caption">Nossa família</figcaption></figure>
          <div class="about-copy about-family-copy">
            <p>Nossa família é formada por cinco filhos: Matheus, Arthur, Israel, Davi e Eva. Matheus e Arthur vivem para sempre em nossos corações. Israel, Davi e Eva são a nossa alegria diária e a inspiração para fazermos cada trabalho com ainda mais amor e dedicação.</p>
            <p>Mais do que uma empresa, o Studio Araújo é um sonho que nasceu em oração, foi confiado a Deus desde o início e continua sendo construído todos os dias com fé, dedicação e gratidão.</p>
          </div>
        </div>
        <blockquote class="about-closing"><p>Seja bem-vindo ao Studio Araújo. Será uma alegria contar um pedacinho da sua história através do nosso olhar.</p></blockquote>
      </div>
    </div>
  </section>
'''
          s = s[:start] + replacement + s[end:]

          required = [
              'Somos Michele Araújo e Wellington Araújo, casal, pais e fotógrafos.',
              'Nossa família é formada por cinco filhos: Matheus, Arthur, Israel, Davi e Eva.',
              'Nossa história na fotografia começou em 2015, em Sítio Alegre.',
              'Em 2020, nasceu um novo capítulo: o Studio Araújo.',
              'Acreditamos que fotografar vai muito além de fazer belas imagens.',
              'Seguimos investindo em conhecimento, equipamentos, estrutura e atendimento,',
              'Mais do que uma empresa, o Studio Araújo é um sonho que nasceu em oração,',
              'Seja bem-vindo ao Studio Araújo. Será uma alegria contar um pedacinho da sua história através do nosso olhar.'
          ]
          for text in required:
              if text not in s:
                  raise SystemExit('Texto original ausente: ' + text)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          grep -q 'class="about-closing"' sobre.html
          grep -q '2015 → 2020 → hoje' sobre.html
          rm -f .about-editorial-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sobre.html .about-editorial-trigger
          git commit -m 'Refine About page editorial structure'
          git push origin main
