name: Remove product services

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-product-services.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply product service cleanup
        run: python scripts/remove_product_services_temp.py

      - name: Validate JavaScript
        run: |
          node --check script.js
          node --check dados-servicos.js
          node --check agenda.js
          node --check admin.js

      - name: Validate site
        run: python scripts/validate_site.py

      - name: Commit cleanup
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add servicos.html dados-servicos.js agenda.js admin.js styles.css script.js scripts/validate_site.py
          git commit -m "Remove product services and darken mobile CTA"
          git push origin main
