name: Apply second mobile polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Apply mobile refinements
        run: python scripts/mobile_polish_round2_temp.py

      - name: Validate JavaScript
        run: |
          node --check script.js
          node --check depoimentos.js

      - name: Validate site
        run: python scripts/validate_site.py

      - name: Commit refinements
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css depoimentos.js script.js agendamento.css assets/cta-final-mobile.webp
          git commit -m "Refine testimonials CTA and booking on mobile"
          git push origin main
