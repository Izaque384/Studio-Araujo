name: Increase About quote
on:
  push:
    paths:
      - '.increase-about-quote-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/increase-about-quote.py
      - name: Validate patch
        run: |
          grep -q "font-size:clamp(1.82rem,3.45vw,2.58rem)" sobre.html
          grep -q "font-size:clamp(1.58rem,7.5vw,2.08rem)" sobre.html
      - name: Commit patch
        run: |
          rm -f .increase-about-quote-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sobre.html .increase-about-quote-run
          git commit -m 'Increase About closing quote proportionally'
          git push origin main
