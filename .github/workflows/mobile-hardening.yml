name: Mobile responsiveness hardening
on:
  push:
    paths:
      - '.mobile-hardening-run'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* ---------- MOBILE HARDENING 2026-09 ---------- */'
          block = r'''

/* ---------- MOBILE HARDENING 2026-09 ---------- */
/* Ajustes finais de ergonomia para telas de toque sem alterar o desktop. */
body.nav-open{
  overflow:hidden;
}

@media (max-width:820px){
  .nav-links{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding-top:max(40px, env(safe-area-inset-top));
    padding-bottom:max(40px, env(safe-area-inset-bottom));
  }
  .nav-links a{
    min-height:44px;
    display:flex;
    align-items:center;
  }
  .burger{
    width:44px;
    height:44px;
    padding:0;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
}

@media (max-width:600px){
  .wrap{
    padding-left:20px;
    padding-right:20px;
  }
  section{
    padding-top:80px;
    padding-bottom:80px;
  }
  section.tight{
    padding-top:64px;
    padding-bottom:88px;
  }
  .cta-band{
    padding-top:48px;
    padding-bottom:84px;
  }
  .hero{
    min-height:100svh;
  }
  .hero-actions,
  .cta-actions,
  .portfolio-cta{
    gap:12px;
  }
  .hero-actions .btn,
  .cta-actions .btn,
  .portfolio-cta .btn{
    min-height:48px;
    justify-content:center;
  }
  .social a{
    width:44px;
    height:44px;
  }
  .gallery-btn{
    min-height:44px;
  }
  .carousel-nav{
    width:44px !important;
    height:44px !important;
  }
  .bk-cal{
    padding:12px;
  }
  .bk-cal-nav{
    width:44px;
    height:44px;
  }
  .bk-dia{
    height:44px;
    min-height:44px;
    font-size:.9rem;
  }
}
'''
          if marker not in text:
              text = text.rstrip() + block + '\n'
              css.write_text(text, encoding='utf-8')

          js = Path('script.js')
          code = js.read_text(encoding='utf-8')
          old = """const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
burger.addEventListener('click', () => navLinks.classList.toggle('open'));
navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));"""
          new = """const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
const fecharMenu = () => {
  navLinks.classList.remove('open');
  document.body.classList.remove('nav-open');
  burger.setAttribute('aria-expanded', 'false');
};
const alternarMenu = () => {
  const abrir = !navLinks.classList.contains('open');
  navLinks.classList.toggle('open', abrir);
  document.body.classList.toggle('nav-open', abrir);
  burger.setAttribute('aria-expanded', abrir ? 'true' : 'false');
};
burger.setAttribute('aria-expanded', 'false');
burger.setAttribute('aria-controls', 'navLinks');
burger.addEventListener('click', alternarMenu);
navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', fecharMenu));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && navLinks.classList.contains('open')) {
    fecharMenu();
    burger.focus();
  }
});
window.addEventListener('resize', () => {
  if (window.innerWidth > 820 && navLinks.classList.contains('open')) fecharMenu();
});"""
          if old in code:
              code = code.replace(old, new, 1)
              js.write_text(code, encoding='utf-8')
          elif "const fecharMenu = () =>" not in code:
              raise SystemExit('Bloco do menu mobile não encontrado em script.js')
          PY
      - name: Validate files
        run: |
          node --check script.js
          grep -q "MOBILE HARDENING 2026-09" styles.css
          grep -q "height:100dvh" styles.css
          grep -q "min-height:44px" styles.css
          grep -q "const fecharMenu = () =>" script.js
          grep -q "aria-expanded" script.js
      - name: Commit mobile hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css script.js
          git commit -m 'Harden public site mobile responsiveness'
          git push origin main
