name: Run CTA fullbleed fix
on:
  push:
    paths:
      - '.cta-fullbleed-run'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_cta_fullbleed.py
      - run: |
          node --check script.js
          grep -q "inset:-12%" script.js
          grep -q "transparent 43%" script.js
          rm -f .cta-fullbleed-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .cta-fullbleed-run
          git commit -m 'Fix CTA with full-bleed diffuse background'
          git push origin main
