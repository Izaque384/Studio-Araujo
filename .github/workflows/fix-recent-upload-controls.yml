name: Fix recent upload and controls
on:
  push:
    paths:
      - '.fix-recent-upload-controls-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix-recent-upload-controls.py
      - name: Validate
        run: |
          node --check recent-works-admin.js
          grep -q 'mediaWorkCategory || categories' recent-works-admin.js
          grep -q 'aria-label="Fechar"' recent-works-admin.js
          grep -q 'class="recent-card-footer"' recent-works-admin.js
          grep -q '>Salvar</button>' recent-works-admin.js
          if grep -q 'id="recentRefresh">Atualizar' recent-works-admin.js; then exit 1; fi
      - name: Commit changes
        run: |
          rm -f .fix-recent-upload-controls-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recent-works-admin.js .fix-recent-upload-controls-run
          git commit -m 'Fix recent media upload and simplify controls'
          git push origin main
