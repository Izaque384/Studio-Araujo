name: Refine booking review finish
on:
  push:
    paths:
      - '.refine-booking-review-finish-run'
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python scripts/refine_booking_review_finish.py
      - name: Validate
        shell: bash
        run: |
          node --check agenda.js
          grep -q 'seu pedido pronto para revisar e enviar' agenda.js
          ! grep -q 'Seu pedido abre no WhatsApp já preenchido' agendamento.html
          grep -q 'REVISÃO: CHEVRON ÚNICO' styles.css
          grep -q "content:'›'" styles.css
          grep -q 'summary::after' styles.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda.js agendamento.html styles.css
          git commit -m 'Simplify booking review confirmation'
          git push origin main
