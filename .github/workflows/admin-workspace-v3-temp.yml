name: Admin workspace V3 temporary

on:
  push:
    branches: [main]
    paths:
      - 'scripts/admin_workspace_v3_temp.py'
      - 'scripts/fix_admin_workspace_v3_temp.py'
      - '.github/workflows/admin-workspace-v3-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Adapt migration to current panel
        run: python scripts/fix_admin_workspace_v3_temp.py
      - name: Apply panel workspace migration
        run: python scripts/admin_workspace_v3_temp.py
      - name: Validate JavaScript
        run: |
          node --check admin.js
          node --check admin-workspace.js
          node --check recent-works-admin.js
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit panel workspace
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize admin media workspace" || exit 0
          git push origin main
