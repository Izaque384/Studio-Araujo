name: Refine service impact note
on:
  push:
    paths:
      - '.refine-service-impact-note'
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine final impact phrase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('servicos.js')
          s = p.read_text(encoding='utf-8')

          old_css = """    #serviceModal .proposal-detail.is-note{\n      grid-column:1/-1;\n      background:rgba(201,162,75,.035);\n    }"""
          new_css = """    #serviceModal .proposal-impact{\n      position:relative;\n      grid-column:1/-1;\n      margin-top:8px;\n      padding:24px 28px 24px 58px;\n      overflow:hidden;\n      border-top:1px solid rgba(201,162,75,.18);\n      border-bottom:1px solid rgba(201,162,75,.12);\n      background:linear-gradient(90deg,rgba(201,162,75,.065),rgba(201,162,75,.018) 62%,transparent);\n    }\n    #serviceModal .proposal-impact::before{\n      content:'“';\n      position:absolute;\n      left:20px;\n      top:8px;\n      color:rgba(230,200,120,.48);\n      font-family:'Cormorant Garamond',serif;\n      font-size:3.8rem;\n      line-height:1;\n    }\n    #serviceModal .proposal-impact::after{\n      content:'';\n      position:absolute;\n      left:0;\n      top:18px;\n      bottom:18px;\n      width:2px;\n      background:linear-gradient(180deg,transparent,var(--gold),transparent);\n    }\n    #serviceModal .proposal-impact p{\n      margin:0;\n      color:var(--cream);\n      font-family:'Cormorant Garamond',serif;\n      font-size:1.18rem;\n      font-style:italic;\n      line-height:1.55;\n      letter-spacing:.01em;\n    }"""
          if old_css not in s:
              raise SystemExit('Bloco antigo de nota não encontrado')
          s = s.replace(old_css, new_css, 1)

          s = s.replace("      #serviceModal .proposal-detail.is-note{grid-column:auto}\n", "      #serviceModal .proposal-impact{grid-column:auto;padding:21px 20px 21px 50px}\n      #serviceModal .proposal-impact::before{left:16px;top:7px;font-size:3.2rem}\n      #serviceModal .proposal-impact p{font-size:1.08rem}\n", 1)

          old_meta = """  const metaHTML = [\n    detailCard('Prazo de entrega', data.delivery),\n    detailCard('Adicionais', data.extra),\n    detailCard('Deslocamento', data.displacement),\n    detailCard('Pagamento', data.payment),\n    detailCard('Observação', data.note, true)\n  ].join('');"""
          new_meta = """  const metaHTML = [\n    detailCard('Prazo de entrega', data.delivery),\n    detailCard('Adicionais', data.extra),\n    detailCard('Deslocamento', data.displacement),\n    detailCard('Pagamento', data.payment)\n  ].join('');\n  const impactHTML = data.note ? `<div class=\"proposal-impact\"><p>${data.note}</p></div>` : '';"""
          if old_meta not in s:
              raise SystemExit('Bloco metaHTML não encontrado')
          s = s.replace(old_meta, new_meta, 1)

          old_render = """    ${metaHTML ? `<div class=\"modal-meta\">${metaHTML}</div>` : ''}\n    <div class=\"proposal-footer\">"""
          new_render = """    ${(metaHTML || impactHTML) ? `<div class=\"modal-meta\">${metaHTML}${impactHTML}</div>` : ''}\n    <div class=\"proposal-footer\">"""
          if old_render not in s:
              raise SystemExit('Renderização do meta não encontrada')
          s = s.replace(old_render, new_render, 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check servicos.js
          grep -q 'proposal-impact' servicos.js
          ! grep -q "detailCard('Observação'" servicos.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add servicos.js
          git commit -m 'Highlight service closing phrases'
          git push origin main
