name: Enhance CTA image

on:
  push:
    paths:
      - '.cta-enhance-trigger'

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Enhance CTA image without changing composition
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          path = Path('assets/cta-final-hq.webp')
          img = Image.open(path).convert('RGB')
          w, h = img.size

          # Preserve aspect ratio and full frame; increase pixel density only.
          scale = 1.5 if max(w, h) < 3200 else 1.25
          new_size = (round(w * scale), round(h * scale))
          img = img.resize(new_size, Image.Resampling.LANCZOS)

          # Very mild detail recovery; no color/exposure/crop changes.
          img = img.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))

          # High-quality real WebP binary.
          img.save(path, 'WEBP', quality=96, method=6, exact=True)
          print(f'CTA image: {w}x{h} -> {new_size[0]}x{new_size[1]}')
          PY

      - name: Validate WebP
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/cta-final-hq.webp'
          im=Image.open(p)
          im.verify()
          print('Valid WebP binary')
          PY

      - name: Commit enhanced asset
        run: |
          rm -f .cta-enhance-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cta-final-hq.webp .cta-enhance-trigger
          git commit -m 'Improve CTA photo quality only'
          git push origin main
