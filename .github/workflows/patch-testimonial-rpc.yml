name: Patch testimonial RPC

on:
  push:
    paths:
      - '.patch-testimonial-rpc-run'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply RPC patch
        run: python scripts/patch_testimonial_rpc.py
      - name: Validate
        run: |
          node --check depoimentos.js
          python scripts/validate_site.py
      - name: Remove temporary files
        run: rm -f scripts/patch_testimonial_rpc.py .patch-testimonial-rpc-run
      - name: Commit code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows'
          git commit -m 'Use moderated testimonial submission flow'
          git push origin main
