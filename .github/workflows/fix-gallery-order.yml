name: Fix gallery ordering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gallery-order.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Improve media ordering UX
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text, start, end, replacement):
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]

          admin = Path('admin.js')
          text = admin.read_text(encoding='utf-8')

          text = replace_between(
              text,
              'function nextSortOrder(category){',
              "\nuploadBtn.addEventListener('click',async()=>{",
              r'''function orderScopeKey(media){
            if(media?.recent_work_id)return `recent:${media.recent_work_id}`;
            return `category:${media?.category||''}`;
          }
          function orderValue(media){
            const value=Number(media?.sort_order);
            return Number.isFinite(value)&&value>0?value:Number.MAX_SAFE_INTEGER;
          }
          function compareMediaOrder(a,b){
            return orderValue(a)-orderValue(b)
              || new Date(a?.created_at||0)-new Date(b?.created_at||0)
              || String(a?.id||'').localeCompare(String(b?.id||''));
          }
          function orderedScopeItems(media,source=allMedia){
            const key=orderScopeKey(media);
            return source.filter(item=>orderScopeKey(item)===key).slice().sort(compareMediaOrder);
          }
          function orderOptions(count,selected=1){
            const total=Math.max(1,Number(count)||1);
            const current=Math.min(total,Math.max(1,Math.trunc(Number(selected)||1)));
            return Array.from({length:total},(_,index)=>`<option value="${index+1}" ${index+1===current?'selected':''}>${index+1}</option>`).join('');
          }
          async function persistMediaSequence(items){
            for(let index=0;index<items.length;index++){
              const wanted=index+1;
              if(Number(items[index].sort_order)===wanted)continue;
              const {error}=await neon.from('site_images').update({sort_order:wanted}).eq('id',items[index].id);
              if(error)throw error;
              items[index]={...items[index],sort_order:wanted};
            }
          }
          function nextSortOrder(category){
            return allMedia.filter(m=>!m.recent_work_id&&m.category===category).length+1;
          }
          '''
          )

          text = replace_between(
              text,
              'function renderMedia(items){',
              '\nasync function deleteCard(card){',
              r'''function cardOriginalMedia(card){
            return allMedia.find(item=>String(item.id)===String(card.dataset.id))||null;
          }
          function syncCardOrderOptions(card,preferredPosition=null){
            const original=cardOriginalMedia(card),select=card.querySelector('.card-order');
            if(!original||!select)return;
            const target={...original,category:card.querySelector('.card-category').value};
            const count=allMedia.filter(item=>String(item.id)!==String(original.id)&&orderScopeKey(item)===orderScopeKey(target)).length+1;
            const preferred=preferredPosition??Number(select.value||1);
            select.innerHTML=orderOptions(count,preferred);
          }
          function renderMedia(items){
            if(!items.length){imageGrid.innerHTML='<div class="empty">Nenhuma mídia encontrada com estes filtros.</div>';return;}
            imageGrid.innerHTML=items.map(m=>{
              const video=isVideoType(m.mime_type);
              const preview=video?`<video src="${esc(m.public_url)}" controls preload="metadata"></video>`:`<img src="${esc(m.public_url)}" alt="${esc(m.alt_text||categoryLabel(m.category))}" loading="lazy">`;
              const badges=[video?'<span class="photo-badge">Vídeo</span>':'',m.is_cover?'<span class="photo-badge cover">Capa</span>':'',!m.is_visible?'<span class="photo-badge hidden">Oculta</span>':''].join('');
              const peers=orderedScopeItems(m);
              const position=Math.max(1,peers.findIndex(item=>String(item.id)===String(m.id))+1);
              return `<article class="photo-card" data-id="${esc(m.id)}" data-key="${esc(m.storage_key)}">
                <figure>${preview}<div class="photo-badges">${badges}</div><a class="preview-link" href="${esc(m.public_url)}" target="_blank" rel="noopener">Abrir mídia</a></figure>
                <div class="photo-body">
                  <div class="photo-meta"><span>${esc(categoryLabel(m.category))}</span><span>${humanBytes(Number(m.bytes||0))}</span></div>
                  <div class="photo-row">
                    <label class="field-label">Categoria<select class="card-category">${categories.map(c=>`<option value="${esc(c.slug)}" ${c.slug===m.category?'selected':''}>${esc(c.label)}</option>`).join('')}</select></label>
                    <label class="field-label">Posição<select class="card-order" aria-label="Posição na galeria">${orderOptions(peers.length,position)}</select></label>
                  </div>
                  <label class="field-label">Descrição<input class="card-alt" type="text" maxlength="180" value="${esc(m.alt_text||'')}" placeholder="Descrição da mídia"></label>
                  <div class="toggles">
                    <label><input class="card-visible" type="checkbox" ${m.is_visible?'checked':''}> Publicada</label>
                    <label><input class="card-cover" type="checkbox" ${m.is_cover?'checked':''} ${video?'disabled title="Vídeos não podem ser capa"':''}> Capa da categoria</label>
                  </div>
                  <div class="card-state"></div>
                  <div class="card-actions"><button type="button" class="btn save-btn" disabled>Salvar</button><button type="button" class="btn btn-danger delete-btn">Excluir</button></div>
                </div>
              </article>`;
            }).join('');

            imageGrid.querySelectorAll('.photo-card').forEach(card=>{
              card.querySelector('.save-btn').addEventListener('click',()=>saveCard(card));
              card.querySelector('.delete-btn').addEventListener('click',()=>deleteCard(card));
              card.querySelector('.card-category').addEventListener('change',()=>{syncCardOrderOptions(card);markDirty(card);});
              card.querySelector('.card-order').addEventListener('change',()=>markDirty(card));
              card.querySelectorAll('.card-alt,.card-visible,.card-cover').forEach(control=>{
                control.addEventListener(control.matches('input[type=text]')?'input':'change',()=>markDirty(card));
              });
            });
          }
          function markDirty(card){
            card.classList.add('dirty');
            card.querySelector('.save-btn').disabled=false;
            card.querySelector('.card-state').textContent='Alterações ainda não salvas';
          }

          async function saveCard(card){
            const id=card.dataset.id,original=cardOriginalMedia(card);
            if(!original){setMsg(libraryMsg,'Esta mídia não está mais disponível. Atualize a biblioteca.','error');return;}
            const category=card.querySelector('.card-category').value;
            const isCover=card.querySelector('.card-cover').checked;
            const updatedMedia={...original,category};
            const oldScope=orderScopeKey(original),newScope=orderScopeKey(updatedMedia);
            const targetItems=allMedia.filter(item=>String(item.id)!==String(id)&&orderScopeKey(item)===newScope).slice().sort(compareMediaOrder);
            const maxPosition=targetItems.length+1;
            const desiredPosition=Math.min(maxPosition,Math.max(1,Math.trunc(Number(card.querySelector('.card-order').value)||1)));
            const payload={
              category,
              sort_order:desiredPosition,
              alt_text:card.querySelector('.card-alt').value.trim(),
              is_visible:card.querySelector('.card-visible').checked,
              is_cover:isCover
            };
            const btn=card.querySelector('.save-btn');btn.disabled=true;btn.textContent='Salvando…';
            try{
              if(isCover){
                const {error:e}=await neon.from('site_images').update({is_cover:false}).eq('category',category).neq('id',id);
                if(e)throw e;
              }
              const {error}=await neon.from('site_images').update(payload).eq('id',id);
              if(error)throw error;

              const targetSequence=targetItems;
              targetSequence.splice(desiredPosition-1,0,{...original,...payload});
              await persistMediaSequence(targetSequence);

              if(oldScope!==newScope){
                const oldSequence=allMedia.filter(item=>String(item.id)!==String(id)&&orderScopeKey(item)===oldScope).slice().sort(compareMediaOrder);
                await persistMediaSequence(oldSequence);
              }

              setMsg(libraryMsg,'Alterações salvas e ordem da galeria reorganizada.','success');
              await loadMedia();
            }catch(e){
              console.error(e);setMsg(libraryMsg,'Não foi possível salvar esta mídia.','error');btn.disabled=false;btn.textContent='Salvar';
            }
          }
          '''
          )

          text = replace_between(
              text,
              'async function deleteCard(card){',
              '\n\nrenderQueue();',
              r'''async function deleteCard(card){
            if(!confirm('Excluir esta mídia da biblioteca e do site? Esta ação não pode ser desfeita.'))return;
            const id=card.dataset.id,key=card.dataset.key,btn=card.querySelector('.delete-btn'),removed=cardOriginalMedia(card);
            btn.disabled=true;btn.textContent='Excluindo…';
            try{
              const {error}=await neon.from('site_images').delete().eq('id',id);
              if(error)throw error;

              let storageWarning=false,orderWarning=false;
              if(!key.startsWith('legacy:')){
                try{await storageCall({action:'delete',storageKey:key});}
                catch(storageErr){storageWarning=true;console.warn('Registro removido, mas o arquivo não pôde ser limpo do storage.',storageErr);}
              }

              allMedia=allMedia.filter(m=>String(m.id)!==String(id));
              if(removed){
                try{await persistMediaSequence(orderedScopeItems(removed,allMedia));}
                catch(orderErr){orderWarning=true;console.warn('Mídia removida, mas a sequência não pôde ser renumerada.',orderErr);}
              }
              await loadMedia();
              const warning=storageWarning||orderWarning;
              setMsg(libraryMsg,warning?'Mídia removida. Parte da limpeza automática não pôde ser concluída; atualize a biblioteca e tente novamente se necessário.':'Mídia excluída e ordem da galeria reorganizada.',warning?'warn':'success');
            }catch(e){
              console.error(e);setMsg(libraryMsg,'Não foi possível excluir esta mídia.','error');btn.disabled=false;btn.textContent='Excluir';
            }
          }
          '''
          )

          admin.write_text(text,encoding='utf-8')

          recent = Path('recent-works-admin.js')
          r = recent.read_text(encoding='utf-8')
          r = r.replace('let recentWorkCount = 0;','let recentWorkCount = 0;\nlet currentWorkMedia = [];',1)
          r = r.replace('.recent-media-card-body input{width:100%;', '.recent-media-card-body input,.recent-media-card-body select{width:100%;',1)

          r = replace_between(
              r,
              'async function loadWorkMedia(){',
              '\nasync function openMediaManager(item, shouldScroll=true){',
              r'''function compareWorkMedia(a,b){
            const av=Number(a?.sort_order),bv=Number(b?.sort_order);
            const ao=Number.isFinite(av)&&av>0?av:Number.MAX_SAFE_INTEGER;
            const bo=Number.isFinite(bv)&&bv>0?bv:Number.MAX_SAFE_INTEGER;
            return ao-bo||new Date(a?.created_at||0)-new Date(b?.created_at||0)||String(a?.id||'').localeCompare(String(b?.id||''));
          }
          function workOrderOptions(count,selected){
            const total=Math.max(1,Number(count)||1),current=Math.min(total,Math.max(1,Math.trunc(Number(selected)||1)));
            return Array.from({length:total},(_,index)=>`<option value="${index+1}" ${index+1===current?'selected':''}>${index+1}</option>`).join('');
          }
          async function persistWorkMediaSequence(items){
            for(let index=0;index<items.length;index++){
              const wanted=index+1;
              if(Number(items[index].sort_order)===wanted)continue;
              const {error}=await neon.from('site_images').update({sort_order:wanted}).eq('id',items[index].id).eq('recent_work_id',mediaWorkId);
              if(error)throw error;
              items[index]={...items[index],sort_order:wanted};
            }
          }
          async function loadWorkMedia(){
            const grid=document.getElementById('recentMediaGrid'); if(!grid||!mediaWorkId)return;
            grid.innerHTML='<div class="recent-empty">Carregando mídias…</div>';
            const {data:media,error}=await neon.from('site_images').select('id,public_url,storage_key,mime_type,bytes,alt_text,sort_order,is_cover,created_at').eq('recent_work_id',mediaWorkId).order('sort_order',{ascending:true}).order('created_at',{ascending:true});
            if(error){console.error('Falha ao carregar mídias do trabalho',error);grid.innerHTML='<div class="recent-empty">Não foi possível carregar as mídias.</div>';setMediaStatus(error.message||'Não foi possível carregar as mídias.','err');return;}
            currentWorkMedia=(media||[]).slice().sort(compareWorkMedia);
            if(!currentWorkMedia.length){grid.innerHTML='<div class="recent-empty">Nenhuma mídia adicionada ainda.</div>';return;}
            if(currentWorkMedia.some((item,index)=>Number(item.sort_order)!==index+1)){
              try{await persistWorkMediaSequence(currentWorkMedia);}
              catch(repairError){console.warn('Não foi possível normalizar a sequência desta galeria.',repairError);setMediaStatus('A galeria foi carregada, mas a sequência antiga não pôde ser corrigida automaticamente.','err');}
            }
            grid.innerHTML=currentWorkMedia.map((m,index)=>{const video=String(m.mime_type||'').startsWith('video/');const preview=video?`<video src="${esc(m.public_url)}" controls preload="metadata"></video>`:`<img src="${esc(m.public_url)}" alt="${esc(m.alt_text||'')}" loading="lazy">`;return `<article class="recent-media-card" data-media-id="${esc(m.id)}" data-key="${esc(m.storage_key)}"><figure>${preview}</figure><div class="recent-media-card-body"><label>Posição<select class="recent-media-order" aria-label="Posição na galeria">${workOrderOptions(currentWorkMedia.length,index+1)}</select></label><div class="recent-media-actions"><button type="button" class="btn btn-ghost recent-set-cover ${m.is_cover?'recent-cover-on':''}" ${video?'disabled title="Vídeo não pode ser capa"':''}>${m.is_cover?'Capa atual':'Definir capa'}</button><button type="button" class="btn btn-danger recent-remove-media">Excluir</button></div></div></article>`}).join('');
            grid.querySelectorAll('.recent-media-card').forEach(card=>{card.querySelector('.recent-media-order')?.addEventListener('change',()=>updateMediaOrder(card));card.querySelector('.recent-set-cover')?.addEventListener('click',()=>setWorkCover(card));card.querySelector('.recent-remove-media')?.addEventListener('click',()=>deleteWorkMedia(card));});
          }
          '''
          )

          old_upload = '''    const visibleOrders=[...document.querySelectorAll('#recentMediaGrid .recent-media-order')]
                .map(input=>Number(input.value||0)).filter(Number.isFinite);
              let order=visibleOrders.length?Math.max(...visibleOrders)+1:1;'''
          new_upload = '''    let order=currentWorkMedia.length+1;'''
          if old_upload not in r:
              raise SystemExit('Recent upload order block not found')
          r = r.replace(old_upload,new_upload,1)

          r = replace_between(
              r,
              'async function updateMediaOrder(card){',
              '\nasync function setWorkCover(card){',
              r'''async function updateMediaOrder(card){
            const mediaId=card.dataset.mediaId,target=currentWorkMedia.find(item=>String(item.id)===String(mediaId));
            if(!target)return;
            const others=currentWorkMedia.filter(item=>String(item.id)!==String(mediaId));
            const desired=Math.min(others.length+1,Math.max(1,Math.trunc(Number(card.querySelector('.recent-media-order').value)||1)));
            const reordered=others.slice();reordered.splice(desired-1,0,target);
            setMediaStatus('Atualizando ordem…');
            try{
              await persistWorkMediaSequence(reordered);
              currentWorkMedia=reordered;
              setMediaStatus('Ordem atualizada.','ok');notifyRecentWorksChanged();showSaveIndicator('Ordem salva automaticamente');await loadWorkMedia();
            }catch(error){console.error(error);setMediaStatus('Não foi possível alterar a ordem.','err');await loadWorkMedia();}
          }
          '''
          )

          r = replace_between(
              r,
              'async function deleteWorkMedia(card){',
              '\n\nasync function init() {',
              r'''async function deleteWorkMedia(card){
            if(!confirm('Excluir esta mídia deste trabalho?'))return;const mediaId=card.dataset.mediaId,key=card.dataset.key;setMediaStatus('Excluindo…');
            const {error}=await neon.from('site_images').delete().eq('id',mediaId).eq('recent_work_id',mediaWorkId);if(error){setMediaStatus('Não foi possível excluir esta mídia.','err');return;}
            currentWorkMedia=currentWorkMedia.filter(item=>String(item.id)!==String(mediaId));
            let orderWarning=false;
            try{await persistWorkMediaSequence(currentWorkMedia);}catch(sequenceError){orderWarning=true;console.warn('Mídia excluída, mas a sequência não pôde ser renumerada.',sequenceError);}
            if(key&&!key.startsWith('legacy:')){const deleter=window.studioStorageCall||storageCall;await deleter({action:'delete',storageKey:key}).catch(()=>{});}
            setMediaStatus(orderWarning?'Mídia excluída, mas a ordem precisa ser atualizada novamente.':'Mídia excluída e ordem reorganizada.',orderWarning?'err':'ok');notifyRecentWorksChanged();showSaveIndicator('Mídia removida');await loadWorkMedia();
          }
          '''
          )

          recent.write_text(r,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check admin.js
          node --check recent-works-admin.js
          python scripts/validate_site.py

      - name: Commit ordering improvements
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin.js recent-works-admin.js
          git commit -m "Fix gallery media ordering"
          git push origin main
