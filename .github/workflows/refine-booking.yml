name: Refine booking experience
on:
  push:
    paths:
      - '.refine-booking-run'
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinement
        run: python scripts/refine_booking_once.py
      - name: Validate
        shell: bash
        run: |
          node --check agenda.js
          node --check dados-servicos.js
          grep -q 'const bookingCatalog' dados-servicos.js
          grep -q 'function progressoDaEtapa' agenda.js
          grep -q 'precisaHorarioSelecionado' agenda.js
          grep -q 'AGENDAMENTO · REFINAMENTO PREMIUM' styles.css
          ! grep -q 'const CATALOGO = \[' agenda.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda.js dados-servicos.js styles.css
          git commit -m 'Refine premium booking experience'
          git push origin main
