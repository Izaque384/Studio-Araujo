name: Refine booking experience
on:
  push:
    paths:
      - '.refine-booking-run'
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime fix
        run: python scripts/fix_booking_refinement.py
      - name: Validate
        shell: bash
        run: |
          node --check agenda.js
          node --check dados-servicos.js
          grep -q 'const bookingCatalog' dados-servicos.js
          grep -q 'function progressoDaEtapa' agenda.js
          grep -q 'precisaHorarioSelecionado' agenda.js
          grep -q 'if(!precisaHorarioSelecionado())seguir()' agenda.js
          ! grep -q 'TOTAL' agenda.js
          grep -q 'AGENDAMENTO · REFINAMENTO PREMIUM' styles.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda.js
          git commit -m 'Fix booking fallback and resume flow'
          git push origin main
