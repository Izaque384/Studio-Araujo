name: Fix CTA HQ image v2

on:
  push:
    paths:
      - '.github/workflows/fix-cta-hq-v2.yml'

permissions:
  contents: write

jobs:
  rebuild-cta-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Rebuild HQ CTA image from working source
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          src = 'assets/cta-final.webp'
          dst = 'assets/cta-final-hq.webp'
          im = Image.open(src).convert('RGB')
          target_w = 1440
          target_h = round(im.height * target_w / im.width)
          up = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
          up = up.filter(ImageFilter.UnsharpMask(radius=1.0, percent=55, threshold=3))
          up.save(dst, 'WEBP', quality=94, method=6)
          print('saved', dst, Image.open(dst).size)
          PY

      - name: Commit rebuilt binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cta-final-hq.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild CTA HQ image as valid WebP binary'
          git push
