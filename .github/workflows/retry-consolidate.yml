name: Retry site consolidation

on:
  push:
    paths:
      - '.github/workflows/retry-consolidate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Treat missing commercial packages as content warnings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/consolidate_site.py')
          s=p.read_text(encoding='utf-8')
          old="    if missing: errors.append('Serviços sem pacote em dados-servicos.js: '+', '.join(missing))"
          new="    if missing: print('AVISO: serviços sem pacote comercial: '+', '.join(missing))"
          if old not in s:
              raise SystemExit('Linha do validator não encontrada')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply consolidation
        run: python scripts/consolidate_site.py
      - name: Validate result
        run: python scripts/validate_site.py
      - name: Remove retry workflow
        run: rm -f .github/workflows/retry-consolidate.yml
      - name: Commit consolidated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate site architecture and safeguards'
          git push origin main
