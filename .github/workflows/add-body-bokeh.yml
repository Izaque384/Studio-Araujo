name: Add body bokeh
on:
  push:
    paths:
      - '.add-body-bokeh-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/add-body-bokeh.py
      - name: Validate patch
        run: |
          grep -q "function adicionarBodyBokeh" script.js
          grep -q "body-bokeh-dot" script.js
      - name: Commit patch
        run: |
          rm -f .add-body-bokeh-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .add-body-bokeh-run
          git commit -m 'Add subtle body bokeh to inner pages'
          git push origin main
