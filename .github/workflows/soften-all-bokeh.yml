name: Soften all bokeh
on:
  push:
    paths:
      - '.soften-all-bokeh-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/soften-all-bokeh.py
      - name: Validate patch
        run: |
          grep -q "opacity:.14" script.js
          grep -q "25%{ opacity:0.34; }" styles.css
          grep -q "75%{ opacity:0.18; }" styles.css
      - name: Commit patch
        run: |
          rm -f .soften-all-bokeh-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js styles.css .soften-all-bokeh-run
          git commit -m 'Soften bokeh across the site'
          git push origin main
