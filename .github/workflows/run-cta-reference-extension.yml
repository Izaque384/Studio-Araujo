name: Run CTA reference extension
on:
  push:
    paths:
      - '.cta-reference-extension-run'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/cta-reference-extension.py
      - run: |
          node --check script.js
          grep -q "background:#090705" script.js
          grep -q "rgba(91,43,19,.22)" script.js
          rm -f .cta-reference-extension-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .cta-reference-extension-run
          git commit -m 'Extend CTA photo tones across card'
          git push origin main
