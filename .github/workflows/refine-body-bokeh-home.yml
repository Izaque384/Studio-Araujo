name: Refine body bokeh and enable on home
on:
  push:
    paths:
      - '.refine-body-bokeh-home-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/refine-body-bokeh-home.py
      - name: Validate patch
        run: |
          grep -q "main > section:not(.page-hero):not(.hero)" script.js
          grep -q "size: 150" script.js
          grep -q "opacity:.22" script.js
      - name: Commit patch
        run: |
          rm -f .refine-body-bokeh-home-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .refine-body-bokeh-home-run
          git commit -m 'Refine body bokeh and enable it on home'
          git push origin main
