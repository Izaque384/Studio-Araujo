name: Run CTA seamless background
on:
  push:
    paths:
      - '.cta-single-background-run'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/cta-single-background.py
      - run: |
          node --check script.js
          grep -q "cta-photo-main{display:none" script.js
          grep -q "animation:none!important" script.js
          grep -q "url('assets/cta-final-hq.webp') right center/auto 100% no-repeat" script.js
          rm -f .cta-single-background-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .cta-single-background-run
          git commit -m 'Make CTA photo blend seamless and static'
          git push origin main
