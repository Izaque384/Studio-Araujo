name: Apply mobile polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mobile refinements
        run: python scripts/mobile_polish_temp.py

      - name: Validate changed JavaScript
        run: |
          node --check script.js
          node --check depoimentos.js

      - name: Run permanent site validation
        run: python scripts/validate_site.py

      - name: Commit mobile fixes
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css servicos.css agendamento.css script.js depoimentos.js
          git commit -m "Polish mobile experience across site"
          git push origin main
