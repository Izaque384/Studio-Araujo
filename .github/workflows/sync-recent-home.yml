name: Sync recent works home
on:
  push:
    paths:
      - '.sync-recent-home-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/sync-recent-home.py
      - name: Validate
        run: |
          node --check recent-works.js
          grep -q "if (!trabalhos.length) { if (existente) existente.hidden = true; return; }" recent-works.js
          grep -q "if (!validos.length) { if (existente) existente.hidden = true; return; }" recent-works.js
          grep -q "relsError" recent-works.js
      - name: Commit changes
        run: |
          rm -f .sync-recent-home-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recent-works.js .sync-recent-home-run
          git commit -m 'Keep Home recent works synchronized with admin'
          git push origin main
