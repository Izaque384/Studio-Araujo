name: Fix Neon auth adapter
on:
  push:
    paths:
      - '.fix-neon-adapter-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply adapter repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('admin.js','recent-works-admin.js'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              old="import { createClient } from 'https://esm.sh/@neondatabase/neon-js@0.7.0-beta?bundle';"
              new="import { createClient, BetterAuthVanillaAdapter } from 'https://esm.sh/@neondatabase/neon-js@0.7.0-beta?bundle';"
              if s.count(old)!=1:
                  raise SystemExit(f'{name}: import match count {s.count(old)}')
              s=s.replace(old,new,1)
              old2="const neon = createClient({ auth: { url: AUTH_URL }, dataApi: { url: DATA_API_URL } });"
              new2="const neon = createClient({ auth: { adapter: BetterAuthVanillaAdapter(), url: AUTH_URL }, dataApi: { url: DATA_API_URL } });"
              if s.count(old2)!=1:
                  raise SystemExit(f'{name}: client match count {s.count(old2)}')
              p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check admin.js
          node --check recent-works-admin.js
          grep -q "BetterAuthVanillaAdapter" admin.js
          grep -q "BetterAuthVanillaAdapter" recent-works-admin.js
          grep -q "adapter: BetterAuthVanillaAdapter()" admin.js
          grep -q "adapter: BetterAuthVanillaAdapter()" recent-works-admin.js
      - name: Commit repair
        run: |
          rm -f .fix-neon-adapter-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js recent-works-admin.js .fix-neon-adapter-run
          git commit -m 'Use explicit Neon Better Auth adapter'
          git push origin main
