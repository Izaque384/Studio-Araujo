name: Boost body bokeh
on:
  push:
    paths:
      - '.boost-body-bokeh-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/boost-body-bokeh.py
      - name: Validate patch
        run: |
          grep -q "mix-blend-mode:screen" script.js
          grep -q "opacity:.30" script.js
          grep -q "size: 220" script.js
      - name: Commit patch
        run: |
          rm -f .boost-body-bokeh-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .boost-body-bokeh-run
          git commit -m 'Increase body bokeh visibility'
          git push origin main
