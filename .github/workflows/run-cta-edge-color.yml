name: Run CTA edge color
on:
  push:
    paths:
      - '.cta-edge-color-run'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/cta-match-edge-color.py
      - run: |
          node --check script.js
          grep -q "background:#17120c" script.js
          grep -q "transparent 54%" script.js
          rm -f .cta-edge-color-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .cta-edge-color-run
          git commit -m 'Match CTA card to photo edge color'
          git push origin main
