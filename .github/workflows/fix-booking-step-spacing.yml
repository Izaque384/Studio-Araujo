name: Fix booking step spacing
on:
  push:
    paths:
      - '.fix-booking-step-spacing-run'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing fix
        run: python scripts/fix_booking_step_spacing.py
      - name: Validate
        shell: bash
        run: |
          grep -q 'AGENDAMENTO · ETAPAS SEM PADDING GLOBAL' styles.css
          grep -q 'booking-panel .bk-etapa' styles.css
          grep -q 'padding:0 !important' styles.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'Remove empty spacing from booking steps'
          git push origin main
