name: Fix recent media flow
on:
  push:
    paths:
      - '.fix-recent-media-flow-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix-recent-media-flow.py
      - name: Validate
        run: |
          node --check admin.js
          node --check recent-works-admin.js
          node --check recent-works.js
          grep -q 'window.studioUploadMedia' admin.js
          grep -q "databaseCategory:RECENT_MEDIA_CATEGORY" recent-works-admin.js
          grep -q 'if (!itens.length) return null' recent-works.js
          if grep -q 'const remoto = await midiasDoPainel(t.gallery_category)' recent-works.js; then exit 1; fi
      - name: Commit changes
        run: |
          rm -f .fix-recent-media-flow-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.js recent-works-admin.js recent-works.js .fix-recent-media-flow-run
          git commit -m 'Fix recent work media upload and remove portfolio fallback'
          git push origin main
