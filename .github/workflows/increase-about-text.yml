name: Increase About text
on:
  push:
    paths:
      - '.increase-about-text-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/increase-about-text.py
      - name: Validate patch
        run: |
          grep -q "font-size:clamp(1.06rem,1.25vw,1.14rem)" sobre.html
          grep -q "font-size:1.03rem" sobre.html
      - name: Commit patch
        run: |
          rm -f .increase-about-text-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sobre.html .increase-about-text-run
          git commit -m 'Increase About page body text size'
          git push origin main
