name: Refine contact page
on:
  push:
    paths:
      - '.refine-contact-page'
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Contact page refinement
        run: python scripts/refine_contact_once.py
      - name: Validate
        shell: bash
        run: |
          grep -q 'contact-premium-grid' contato.html
          grep -q 'Traçar rota' contato.html
          grep -q 'contact-map-caption' styles.css
          ! grep -q 'class="contato-grid"' contato.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contato.html styles.css
          git commit -m 'Refine premium contact experience'
          git push origin main
