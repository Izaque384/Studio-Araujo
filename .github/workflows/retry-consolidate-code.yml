name: Retry consolidation code only

on:
  push:
    paths:
      - '.github/workflows/retry-consolidate-code.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Treat missing commercial packages as content warnings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/consolidate_site.py')
          s=p.read_text(encoding='utf-8')
          old="    if missing: errors.append('Serviços sem pacote em dados-servicos.js: '+', '.join(missing))"
          new="    if missing: print('AVISO: serviços sem pacote comercial: '+', '.join(missing))"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply consolidation
        run: python scripts/consolidate_site.py
      - name: Restore workflow directory for connector-managed changes
        run: git restore --source=HEAD --staged --worktree .github/workflows
      - name: Validate result
        run: python scripts/validate_site.py
      - name: Commit code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows'
          git commit -m 'Consolidate site architecture and safeguards'
          git push origin main
