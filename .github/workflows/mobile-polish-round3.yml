name: Apply third mobile polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish-round3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply refinements
        run: python scripts/mobile_polish_round3_temp.py

      - name: Validate JavaScript
        run: node --check script.js

      - name: Validate site
        run: python scripts/validate_site.py

      - name: Commit refinements
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css servicos.css script.js
          git commit -m "Refine mobile CTA about and service budgets"
          git push origin main
