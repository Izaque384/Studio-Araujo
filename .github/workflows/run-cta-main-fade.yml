name: Run CTA main fade
on:
  push:
    paths:
      - '.cta-main-fade-run'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fade_cta_main_photo.py
      - run: |
          node --check script.js
          grep -q "transparent 50%" script.js
          grep -q "#000 92%" script.js
          rm -f .cta-main-fade-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .cta-main-fade-run
          git commit -m 'Fade CTA main photo into diffuse background'
          git push origin main
