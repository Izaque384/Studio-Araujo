name: Apply global background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-global-background.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update global site background
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          old = text
          text = text.replace('--bg: #0e0d0b;', '--bg: #0d0d0c;', 1)
          text = text.replace('background:rgba(14,13,11,0.92);', 'background:rgba(13,13,12,0.92);', 1)
          if text == old:
              raise SystemExit('Expected background values were not found; no changes made.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit background change
        run: |
          git config user.name "Studio Araújo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css
          git commit -m "Use neutral background across public site"
          git push origin main
