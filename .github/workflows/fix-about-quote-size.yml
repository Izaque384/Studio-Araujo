name: Fix About quote size
on:
  push:
    paths:
      - '.fix-about-quote-size-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix-about-quote-size.py
      - name: Validate patch
        run: |
          grep -q "p.sobre-closing-quote" sobre.html
          grep -q "2.9rem)!important" sobre.html
      - name: Commit patch
        run: |
          rm -f .fix-about-quote-size-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sobre.html .fix-about-quote-size-run
          git commit -m 'Make About closing quote visibly larger'
          git push origin main
