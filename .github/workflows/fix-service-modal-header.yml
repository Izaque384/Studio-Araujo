name: Fix service modal header
on:
  push:
    paths:
      - '.fix-service-modal-header'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix proposal header flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('servicos.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<header class="proposal-header">', '<div class="proposal-header">')
          s = s.replace('</header>', '</div>')
          old = """#serviceModal .proposal-header{\n      padding:4px 56px 30px 0;"""
          new = """#serviceModal .proposal-header{\n      position:static;\n      inset:auto;\n      z-index:auto;\n      width:auto;\n      padding:4px 56px 30px 0;"""
          if old not in s:
              raise SystemExit('Bloco proposal-header não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check servicos.js
          grep -q '<div class="proposal-header">' servicos.js
          ! grep -q '<header class="proposal-header">' servicos.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add servicos.js
          git commit -m 'Fix service proposal header overlap'
          git push origin main
