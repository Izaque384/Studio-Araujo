name: Consolidate site

on:
  push:
    paths:
      - '.consolidate-site-run'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consolidation
        run: python scripts/consolidate_site.py
      - name: Validate result
        run: python scripts/validate_site.py
      - name: Commit consolidated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate site architecture and safeguards'
          git push origin main
