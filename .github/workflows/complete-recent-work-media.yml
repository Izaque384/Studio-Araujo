name: Complete recent work media
on:
  push:
    paths:
      - '.complete-recent-work-media-run'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/complete-recent-work-media.py
      - name: Validate files
        run: |
          node --check admin.js
          node --check recent-works-admin.js
          node --check recent-works.js
          grep -q "recent-work-media" admin.js
          grep -q "recent_work_media" recent-works-admin.js
          grep -q "recent_work_media" recent-works.js
          grep -q "data-folder-area=\"recent\"" admin.html
      - name: Commit implementation
        run: |
          rm -f .complete-recent-work-media-run
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html admin.js recent-works-admin.js recent-works.js .complete-recent-work-media-run
          git commit -m 'Add dedicated media to recent works'
          git push origin main
