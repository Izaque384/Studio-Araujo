name: Fix booking service cards
on:
  push:
    paths:
      - '.fix-booking-service-cards-run'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/fix_booking_service_cards.py
      - name: Validate
        shell: bash
        run: |
          node --check agenda.js
          node --check dados-servicos.js
          grep -q 'capaVisualDoServico' agenda.js
          grep -q 'bk-servico-media' agenda.js
          grep -q 'AGENDAMENTO · CARDS DE SERVIÇO E ALTURA NATURAL' styles.css
          grep -q 'height:auto !important' styles.css
          ! grep -q 'bk-servico-txt' agenda.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda.js styles.css
          git commit -m 'Restore booking service photos and compact cards'
          git push origin main
